name: Fork Undo Local product UI experiment
on:
  push:
    branches: [experiment/undo-history-adapter-e10955dc]
permissions:
  contents: read
concurrency:
  group: fork-undo-history-adapter-${{ github.ref }}
  cancel-in-progress: false
env:
  F_SOURCE_SHA: e10955dc5977f1ba7c65cb1518cb8f4b1679fe92
  F_PRODUCER_SHA: 387b7542a901d711cbef2868e686b29726c905f0
  CARGO_INCREMENTAL: '0'
jobs:
  actual-adapter:
    if: github.repository == 'Makeinu1/phase'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      F_DRAFT_PAYLOAD: ${{ github.workspace }}/draft-payload
      F_LOCAL_UI: '1'
      F_LOCAL_HANDOFF_UI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.F_SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify retained exact e109 WASM without Rust compiler
        id: input
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          F_EVIDENCE: ${{ github.workspace }}/adapter-evidence/input
        run: |
          python3 ../control/scripts/ci/undo-f-guard.py adapter-wasm-input \
            python3 ../control/scripts/ci/undo-f-artifact.py wasm \
            "$GITHUB_WORKSPACE/wasm-payload" "$GITHUB_WORKSPACE/reused-inputs/wasm.zip"
          python3 ../control/scripts/ci/undo-f-manifest.py verify \
            "$GITHUB_WORKSPACE/wasm-payload" f2681c2c2ba8e13dde7a6f5e65f461b3fc9957ce7769d339c3bde6250c152659 "$F_PRODUCER_SHA"
          mkdir -p "$GITHUB_WORKSPACE/adapter-evidence/provenance"
          cp "$GITHUB_WORKSPACE/retained-inputs/wasm.provenance.json" "$GITHUB_WORKSPACE/adapter-evidence/provenance/"
          cp "$GITHUB_WORKSPACE/wasm-payload/manifest.json" "$GITHUB_WORKSPACE/adapter-evidence/provenance/wasm-manifest.json"
      - name: Verify existing same-source draft input and provenance
        id: draft_input
        if: ${{ !cancelled() && steps.input.outcome == 'success' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          F_EVIDENCE: ${{ github.workspace }}/adapter-evidence/draft-input
        run: |
          python3 ../control/scripts/ci/undo-f-guard.py adapter-draft-input \
            python3 ../control/scripts/ci/undo-f-draft-artifact.py draft \
            "$F_DRAFT_PAYLOAD" "$GITHUB_WORKSPACE/reused-inputs/draft.zip"
          python3 ../control/scripts/ci/undo-f-manifest.py verify \
            "$F_DRAFT_PAYLOAD" 6a0043113fd25b7f2a0499ac570aabee51ea9e0ba74523309cc3f4e6fbb805a0 eac6c9be9b1e0f1b9406506017c195f1107b6437
          python3 - <<'PY'
          import json, os, pathlib
          draft = pathlib.Path(os.environ['F_DRAFT_PAYLOAD'])
          engine = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'wasm-payload'
          a, b = [json.loads((p / 'manifest.json').read_text()) for p in [draft, engine]]
          provenance = json.loads((draft / 'provenance.json').read_text())
          assert a['source_sha'] == b['source_sha'] == os.environ['F_SOURCE_SHA']
          assert a['input_sha256'] == b['input_sha256'] and a['tool_versions'] == b['tool_versions']
          assert provenance['source_tree'] == 'fa41bb9de9b7d87fe9813bf0f6b8ec3423a3b350'
          evidence = pathlib.Path(os.environ['F_EVIDENCE'])
          for name in ['manifest.json', 'provenance.json']:
              (evidence / name).write_bytes((draft / name).read_bytes())
          (evidence / 'same-source.json').write_text(json.dumps({'pass': True, 'sourceSha': a['source_sha'], 'sourceTree': provenance['source_tree'], 'sameInputHashes': True, 'sameToolVersions': True, 'newBuild': False}, indent=2) + '\n')
          PY
      - name: Lightweight fixed binding public-export selfcheck
        id: public_api
        if: ${{ !cancelled() && steps.draft_input.outcome == 'success' }}
        working-directory: source
        run: |
          python3 ../control/scripts/ci/undo-history-preflight-guard.py input-public-exports \
            "$GITHUB_WORKSPACE/adapter-evidence/public-api" \
            node ../control/scripts/ci/undo-history-adapter-run.mjs \
            "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/wasm-payload" \
            "$GITHUB_WORKSPACE/adapter-evidence/public-api" --selfcheck-only
      - name: Sandboxed Chrome and CDP capability selfcheck
        id: browser
        if: ${{ !cancelled() && steps.public_api.outcome == 'success' }}
        working-directory: source
        run: |
          python3 ../control/scripts/ci/undo-history-preflight-guard.py browser-CDP-capability \
            "$GITHUB_WORKSPACE/adapter-evidence/browser-capability" \
            node ../control/scripts/ci/undo-history-adapter-run.mjs \
            "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/wasm-payload" \
            "$GITHUB_WORKSPACE/adapter-evidence/browser-capability" --browser-selfcheck-only
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        id: pnpm
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        with:
          version: 9.15.9
      - name: Install only pinned client dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && steps.pnpm.outcome == 'success' }}
        working-directory: control/client
        run: pnpm install --frozen-lockfile
      - name: Exact candidate targeted client regression (no Rust build)
        id: targeted_regression
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/adapter-evidence/regression-reports"
          F_EVIDENCE="$GITHUB_WORKSPACE/adapter-evidence/targeted-regression-guard" \
            python3 ../control/scripts/ci/undo-history-runtime-guard.py candidate-client-targeted \
            bash -eu -c '
              cd "$GITHUB_WORKSPACE/control/client"
              pnpm exec tsc -b --pretty false
              pnpm exec eslint src/game/localHistorySession.ts src/hooks/useLocalSeat.ts src/hooks/useGameDispatch.ts
              pnpm exec vitest run --coverage.enabled=false \
                --reporter=default --reporter=json \
                --outputFile.json="$GITHUB_WORKSPACE/adapter-evidence/regression-reports/targeted.json" \
                src/game/__tests__/localHistorySession.test.tsx \
                src/hooks/__tests__/useGameplayPreferencesSync.test.tsx \
                src/hooks/__tests__/useGameDispatch.test.ts \
                src/hooks/__tests__/useKeyboardShortcuts.test.tsx \
                src/components/board/__tests__/ActionButton.test.tsx \
                src/components/board/__tests__/AttachmentFan.test.tsx \
                src/components/zone/__tests__/ZoneViewer.test.tsx \
                src/components/controls/__tests__/PhaseStopBar.test.tsx \
                src/components/hand/__tests__/useHandScrubPreview.test.tsx \
                src/components/settings/__tests__/PreferencesModal.priorityPassing.test.tsx
            '
      - name: QA module dependency selfcheck before engine campaign
        id: module
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.targeted_regression.outcome == 'success' }}
        working-directory: source
        run: |
          python3 ../control/scripts/ci/undo-history-preflight-guard.py QA-module-load \
            "$GITHUB_WORKSPACE/adapter-evidence/module-selfcheck" \
            node ../control/scripts/ci/undo-history-adapter-run.mjs \
            "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/wasm-payload" \
            "$GITHUB_WORKSPACE/adapter-evidence/module-selfcheck" --module-selfcheck-only
      - name: Explicit Local seat handoff, land Undo and real UI reexecution
        id: local_ui
        if: ${{ !cancelled() && steps.module.outcome == 'success' }}
        working-directory: source
        run: |
          F_EVIDENCE="$GITHUB_WORKSPACE/adapter-evidence/guard" \
            python3 ../control/scripts/ci/undo-history-runtime-guard.py real-adapter-browser \
            node ../control/scripts/ci/undo-history-adapter-run.mjs \
            "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/wasm-payload" \
            "$GITHUB_WORKSPACE/adapter-evidence/browser"
          test "$(git -C ../control status --porcelain --untracked-files=no)" = ""
      - name: Full candidate client regression in three bounded shards
        id: full_regression
        if: ${{ !cancelled() && steps.targeted_regression.outcome == 'success' }}
        working-directory: source
        run: |
          F_EVIDENCE="$GITHUB_WORKSPACE/adapter-evidence/test-inventory-guard" \
            python3 ../control/scripts/ci/undo-history-runtime-guard.py candidate-client-test-inventory \
            bash -eu -c '
              cd "$GITHUB_WORKSPACE/control/client"
              pnpm exec vitest list --coverage.enabled=false --filesOnly \
                --json="$GITHUB_WORKSPACE/adapter-evidence/regression-reports/eligible-files.json"
            '
          for shard in 1 2 3; do
            F_TEST_SHARD="$shard" \
              F_EVIDENCE="$GITHUB_WORKSPACE/adapter-evidence/full-regression-shard-$shard-guard" \
              python3 ../control/scripts/ci/undo-history-runtime-guard.py "candidate-client-shard$shard" \
              bash -eu -c '
                cd "$GITHUB_WORKSPACE/control/client"
                pnpm exec vitest run --coverage.enabled=false --shard="$F_TEST_SHARD/3" \
                  --reporter=default --reporter=json \
                  --outputFile.json="$GITHUB_WORKSPACE/adapter-evidence/regression-reports/shard-$F_TEST_SHARD.json"
              '
          done
          python3 - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'adapter-evidence/regression-reports'
          client = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'control/client'
          relative = lambda name: str(pathlib.Path(name).resolve().relative_to(client))
          inventory = json.loads((evidence / 'eligible-files.json').read_text())
          eligible = [relative(row['file']) for row in inventory]
          assert eligible and len(eligible) == len(set(eligible)), 'eligible inventory must contain unique files'
          observed, shards = [], []
          for index in [1, 2, 3]:
              report = json.loads((evidence / f'shard-{index}.json').read_text())
              assert report['success'] and report['numFailedTests'] == report['numFailedTestSuites'] == 0, 'shard failed'
              files = [relative(row['name']) for row in report['testResults']]
              assert files and all(row['status'] in ['passed', 'pending'] for row in report['testResults']), 'file failed'
              observed.extend(files)
              shards.append({'index': index, 'files': files, **{key: report[key] for key in ['numTotalTests', 'numPassedTests', 'numPendingTests', 'numTodoTests']}})
          assert len(observed) == len(set(observed)), 'duplicate files across shards'
          assert set(observed) == set(eligible), 'shards must cover the exact eligible file inventory'
          summary = {'pass': True, 'candidateSha': os.environ['GITHUB_SHA'], 'eligibleFileCount': len(eligible), 'reportedFileCount': len(observed), 'fullFileSetEqual': True, 'noDuplicateFiles': True, 'shards': shards}
          (evidence / 'full-regression-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps({key: value for key, value in summary.items() if key != 'shards'}))
          PY
      - name: Preserve checkout identity after every outcome
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def inspect(folder, expected):
              command = lambda *args: subprocess.check_output(['git', '-C', folder, *args], text=True).strip()
              head = command('rev-parse', 'HEAD')
              dirty = command('status', '--porcelain', '--untracked-files=no')
              return {'head': head, 'expected': expected, 'tracked_clean': not dirty, 'unchanged': head == expected and not dirty}
          receipts = {'source': inspect('source', os.environ['F_SOURCE_SHA']), 'candidate': inspect('control', os.environ['GITHUB_SHA'])}
          evidence = pathlib.Path('adapter-evidence')
          evidence.mkdir(exist_ok=True)
          (evidence / 'checkout-identity.json').write_text(json.dumps(receipts, indent=2) + '\n')
          assert all(row['unchanged'] for row in receipts.values()), 'checkout identity changed'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: undo-history-local-handoff-ui-evidence
          path: adapter-evidence
          if-no-files-found: warn
          retention-days: 7
