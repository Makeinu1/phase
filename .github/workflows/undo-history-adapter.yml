name: Fork Undo Local product UI experiment
on:
  push:
    branches: [experiment/undo-history-adapter-e10955dc]
permissions:
  contents: read
concurrency:
  group: fork-undo-history-adapter-${{ github.ref }}
  cancel-in-progress: false
env:
  F_SOURCE_SHA: e10955dc5977f1ba7c65cb1518cb8f4b1679fe92
  F_PRODUCER_SHA: 387b7542a901d711cbef2868e686b29726c905f0
  CARGO_INCREMENTAL: '0'
jobs:
  actual-adapter:
    if: github.repository == 'Makeinu1/phase'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      F_DRAFT_PAYLOAD: ${{ github.workspace }}/draft-payload
      F_LOCAL_UI: '1'
      F_LOCAL_PROGRESS_UI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /client/
            /scripts/
            /data-files.json
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.F_SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify retained exact e109 WASM without Rust compiler
        id: input
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          F_EVIDENCE: ${{ github.workspace }}/adapter-evidence/input
        run: |
          python3 ../control/scripts/ci/undo-f-guard.py adapter-wasm-input \
            python3 ../control/scripts/ci/undo-f-artifact.py wasm \
            "$GITHUB_WORKSPACE/wasm-payload" "$GITHUB_WORKSPACE/reused-inputs/wasm.zip"
          python3 ../control/scripts/ci/undo-f-manifest.py verify \
            "$GITHUB_WORKSPACE/wasm-payload" f2681c2c2ba8e13dde7a6f5e65f461b3fc9957ce7769d339c3bde6250c152659 "$F_PRODUCER_SHA"
          mkdir -p "$GITHUB_WORKSPACE/adapter-evidence/provenance"
          cp "$GITHUB_WORKSPACE/retained-inputs/wasm.provenance.json" "$GITHUB_WORKSPACE/adapter-evidence/provenance/"
          cp "$GITHUB_WORKSPACE/wasm-payload/manifest.json" "$GITHUB_WORKSPACE/adapter-evidence/provenance/wasm-manifest.json"
      - name: Verify existing same-source draft input and provenance
        id: draft_input
        if: ${{ !cancelled() && steps.input.outcome == 'success' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          F_EVIDENCE: ${{ github.workspace }}/adapter-evidence/draft-input
        run: |
          python3 ../control/scripts/ci/undo-f-guard.py adapter-draft-input \
            python3 ../control/scripts/ci/undo-f-draft-artifact.py draft \
            "$F_DRAFT_PAYLOAD" "$GITHUB_WORKSPACE/reused-inputs/draft.zip"
          python3 ../control/scripts/ci/undo-f-manifest.py verify \
            "$F_DRAFT_PAYLOAD" 6a0043113fd25b7f2a0499ac570aabee51ea9e0ba74523309cc3f4e6fbb805a0 eac6c9be9b1e0f1b9406506017c195f1107b6437
          python3 - <<'PY'
          import json, os, pathlib
          draft = pathlib.Path(os.environ['F_DRAFT_PAYLOAD'])
          engine = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'wasm-payload'
          a, b = [json.loads((p / 'manifest.json').read_text()) for p in [draft, engine]]
          provenance = json.loads((draft / 'provenance.json').read_text())
          assert a['source_sha'] == b['source_sha'] == os.environ['F_SOURCE_SHA']
          assert a['input_sha256'] == b['input_sha256'] and a['tool_versions'] == b['tool_versions']
          assert provenance['source_tree'] == 'fa41bb9de9b7d87fe9813bf0f6b8ec3423a3b350'
          evidence = pathlib.Path(os.environ['F_EVIDENCE'])
          for name in ['manifest.json', 'provenance.json']:
              (evidence / name).write_bytes((draft / name).read_bytes())
          (evidence / 'same-source.json').write_text(json.dumps({'pass': True, 'sourceSha': a['source_sha'], 'sourceTree': provenance['source_tree'], 'sameInputHashes': True, 'sameToolVersions': True, 'newBuild': False}, indent=2) + '\n')
          PY
      - name: Lightweight fixed binding public-export selfcheck
        id: public_api
        if: ${{ !cancelled() && steps.draft_input.outcome == 'success' }}
        working-directory: source
        run: |
          python3 ../control/scripts/ci/undo-history-preflight-guard.py input-public-exports \
            "$GITHUB_WORKSPACE/adapter-evidence/public-api" \
            node ../control/scripts/ci/undo-history-adapter-run.mjs \
            "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/wasm-payload" \
            "$GITHUB_WORKSPACE/adapter-evidence/public-api" --selfcheck-only
      - name: Sandboxed Chrome and CDP capability selfcheck
        id: browser
        if: ${{ !cancelled() && steps.public_api.outcome == 'success' }}
        working-directory: source
        run: |
          python3 ../control/scripts/ci/undo-history-preflight-guard.py browser-CDP-capability \
            "$GITHUB_WORKSPACE/adapter-evidence/browser-capability" \
            node ../control/scripts/ci/undo-history-adapter-run.mjs \
            "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/wasm-payload" \
            "$GITHUB_WORKSPACE/adapter-evidence/browser-capability" --browser-selfcheck-only
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        id: pnpm
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        with:
          version: 9.15.9
      - name: Install only pinned client dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && steps.pnpm.outcome == 'success' }}
        working-directory: control/client
        run: pnpm install --frozen-lockfile
      - name: QA module dependency selfcheck before engine campaign
        id: module
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: source
        run: |
          python3 ../control/scripts/ci/undo-history-preflight-guard.py QA-module-load \
            "$GITHUB_WORKSPACE/adapter-evidence/module-selfcheck" \
            node ../control/scripts/ci/undo-history-adapter-run.mjs \
            "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/wasm-payload" \
            "$GITHUB_WORKSPACE/adapter-evidence/module-selfcheck" --module-selfcheck-only
      - name: Local history ON and OFF progress diagnosis with Setup AI control
        if: ${{ !cancelled() && steps.module.outcome == 'success' }}
        working-directory: source
        run: |
          F_EVIDENCE="$GITHUB_WORKSPACE/adapter-evidence/guard" \
            python3 ../control/scripts/ci/undo-history-runtime-guard.py real-adapter-browser \
            node ../control/scripts/ci/undo-history-adapter-run.mjs \
            "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/wasm-payload" \
            "$GITHUB_WORKSPACE/adapter-evidence/browser"
          test "$(git -C ../control status --porcelain --untracked-files=no)" = ""
      - name: Preserve checkout identity after every outcome
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def inspect(folder, expected):
              command = lambda *args: subprocess.check_output(['git', '-C', folder, *args], text=True).strip()
              head = command('rev-parse', 'HEAD')
              dirty = command('status', '--porcelain', '--untracked-files=no')
              return {'head': head, 'expected': expected, 'tracked_clean': not dirty, 'unchanged': head == expected and not dirty}
          receipts = {'source': inspect('source', os.environ['F_SOURCE_SHA']), 'candidate': inspect('control', os.environ['GITHUB_SHA'])}
          evidence = pathlib.Path('adapter-evidence')
          evidence.mkdir(exist_ok=True)
          (evidence / 'checkout-identity.json').write_text(json.dumps(receipts, indent=2) + '\n')
          assert all(row['unchanged'] for row in receipts.values()), 'checkout identity changed'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: undo-history-local-progress-ui-evidence
          path: adapter-evidence
          if-no-files-found: warn
          retention-days: 7
