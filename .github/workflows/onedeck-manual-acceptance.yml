name: OneDeck manual play acceptance
on:
  push:
    branches: [work/manual-sandbox-undo]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: onedeck-manual-acceptance
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: onedeck-engine-tests
          cache-on-failure: true
      - name: Verify the CR numbers cited by the manual-correction changes
        run: |
          ./scripts/fetch-comp-rules.sh
          for rule in 701.9a 701.20a 701.20b 603.3 701.8a 400.6 119.3 110.2a 121.1 701.17a 704.3 120.3 401.4 603.10a 603.7 122.1 701.21a 701.26a; do
            line=$(grep -m1 "^${rule}[ .]" docs/MagicCompRules.txt || true)
            test -n "$line" || { echo "::error::CR $rule not found"; exit 1; }
            echo "::notice::CR ${line:0:240}"
          done
      - name: Format
        run: cargo fmt --all -- --check
      - name: Manual resolution native tests (feature on)
        run: |
          set -o pipefail
          cargo test -p phase-engine --features manual_resolution_prototype --test manual_resolution_prototype -- --nocapture 2>&1 | tee "$RUNNER_TEMP/on.log" || {
            grep -E "^test .* FAILED|panicked at|^  left|^ right|assertion|^thread|^DIAG" "$RUNNER_TEMP/on.log" | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Manual resolution native tests (feature off)
        run: |
          set -o pipefail
          cargo test -p phase-engine --test manual_resolution_prototype 2>&1 | tee "$RUNNER_TEMP/off.log" || {
            grep -E "^test .* FAILED|panicked at|^  left|^ right|assertion|^thread|^error" "$RUNNER_TEMP/off.log" | head -40 | sed 's/^/::error::/'; exit 1; }

  gates:
    # The upstream quality gates for everything this branch touches.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: onedeck-gates
          cache-on-failure: true
      - name: Clippy (engine, both feature states; server-core; engine-wasm with manual play)
        run: |
          set -o pipefail
          run() { "$@" 2>&1 | tee -a "$RUNNER_TEMP/clippy.log"; }
          fail=0
          run cargo clippy -p phase-engine --all-targets -- -D warnings || fail=1
          run cargo clippy -p phase-engine --all-targets --features manual_resolution_prototype -- -D warnings || fail=1
          run cargo clippy -p server-core --all-targets -- -D warnings || fail=1
          run cargo clippy -p engine-wasm --features manual_resolution_local_bootstrap -- -D warnings || fail=1
          if [ $fail = 1 ]; then grep -E "^(error|warning)|^ +--> " "$RUNNER_TEMP/clippy.log" | head -60 | sed 's/^/::error::/'; exit 1; fi
      - name: Full engine test suite (feature on)
        if: always()
        run: |
          set -o pipefail
          cargo test -p phase-engine --features manual_resolution_prototype 2>&1 | tee "$RUNNER_TEMP/all.log" || {
            grep -E "^test .* FAILED|panicked at|^  left|^ right|^error" "$RUNNER_TEMP/all.log" | head -60 | sed 's/^/::error::/'; exit 1; }
      - uses: pnpm/action-setup@v4
        if: always()
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22
      - name: Client type-check, lint, and full test suite
        if: always()
        working-directory: client
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          fail=0
          pnpm exec tsc -b --noEmit 2>&1 | tee "$RUNNER_TEMP/tsc.log" || fail=1
          pnpm lint 2>&1 | tee "$RUNNER_TEMP/lint.log" || fail=1
          pnpm exec vitest run --coverage.enabled=false 2>&1 | tee "$RUNNER_TEMP/vitest.log" || fail=1
          if [ $fail = 1 ]; then
            grep -E "error TS|  error |FAIL |✗|×|AssertionError" "$RUNNER_TEMP/tsc.log" "$RUNNER_TEMP/lint.log" "$RUNNER_TEMP/vitest.log" | head -60 | sed 's/^/::error::/'
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: onedeck-manual-wasm
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.121
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Week key
        id: week
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: data/mtgjson/AtomicCards.json
          key: onedeck-mtgjson-atomic-${{ steps.week.outputs.week }}
      - uses: actions/cache/restore@v4
        with:
          path: data/card-data.json
          key: onedeck-card-data-${{ steps.week.outputs.week }}-${{ hashFiles('crates/engine/src/**', 'crates/engine/Cargo.toml', 'Cargo.lock') }}
      - name: Card data (MTGJSON -> card-data.json)
        run: |
          if [ -s data/card-data.json ]; then cp data/card-data.json client/public/card-data.json; exit 0; fi
          mkdir -p data/mtgjson
          if [ ! -f data/mtgjson/AtomicCards.json ]; then
            source scripts/lib/mtgjson-fetch.sh
            mtgjson_download AtomicCards.json data/mtgjson/AtomicCards.json
          fi
          cargo run --profile tool --features cli --bin oracle-gen -- data/ --stats --names-out data/card-names.json > data/card-data.json
          cp data/card-data.json client/public/card-data.json
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: data/mtgjson/AtomicCards.json
          key: onedeck-mtgjson-atomic-${{ steps.week.outputs.week }}
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: data/card-data.json
          key: onedeck-card-data-${{ steps.week.outputs.week }}-${{ hashFiles('crates/engine/src/**', 'crates/engine/Cargo.toml', 'Cargo.lock') }}
      - uses: actions/cache/restore@v4
        id: wasmcache
        with:
          path: client/src/wasm
          key: onedeck-manual-wasm-out-${{ hashFiles('crates/**', 'Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      - name: Engine WASM with manual resolution admitted
        if: steps.wasmcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p client/src/wasm
          cargo build --package engine-wasm --target wasm32-unknown-unknown --profile wasm-dev --features manual_resolution_local_bootstrap
          wasm-bindgen --target web --out-dir client/src/wasm --out-name engine_wasm target/wasm32-unknown-unknown/wasm-dev/engine_wasm.wasm
          cargo build --package draft-wasm --target wasm32-unknown-unknown --profile wasm-dev
          wasm-bindgen --target web --out-dir client/src/wasm --out-name draft_wasm target/wasm32-unknown-unknown/wasm-dev/draft_wasm.wasm
      - uses: actions/cache/save@v4
        if: steps.wasmcache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: client/src/wasm
          key: onedeck-manual-wasm-out-${{ hashFiles('crates/**', 'Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      - name: Client install and focused tests
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run --coverage.enabled=false src/stores/__tests__/manualUndoStore.test.ts src/components/modal/__tests__/DialogHost.test.tsx src/i18n/__tests__/localeParity.test.ts src/components/sandbox
      - name: Start dev server
        working-directory: client
        run: |
          nohup pnpm exec vite --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:5173/ >/dev/null && break; sleep 2; done
          curl -sf http://localhost:5173/ >/dev/null
      - name: Browser acceptance on real decks
        env:
          ONEDECK_DECKS: ${{ secrets.ONEDECK_DECKS }}
        run: |
          test -n "$ONEDECK_DECKS" || echo "::warning::ONEDECK_DECKS secret is not set; running the synthetic fallback deck"
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python scripts/ci/onedeck_manual_acceptance.py --base-url http://localhost:5173 \
            --out "$RUNNER_TEMP/evidence" --locale client/src/i18n/locales/ja/game.json
      - name: Encrypt and publish evidence to the evidence branch
        if: always()
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/vite.log" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          tar -czf "$RUNNER_TEMP/evidence.tgz" -C "$RUNNER_TEMP" evidence
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/evidence.tgz" -out "$RUNNER_TEMP/evidence.tgz.enc" -pass file:"$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey .github/onedeck/evidence.pub -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k" -out "$RUNNER_TEMP/k.enc"
          git worktree add --detach "$RUNNER_TEMP/pub"
          cd "$RUNNER_TEMP/pub"
          git switch --orphan evidence-tmp
          mkdir -p runs/${GITHUB_RUN_ID}
          # GitHub refuses files over 100 MB; publish the ciphertext in parts.
          split -b 45m -d "$RUNNER_TEMP/evidence.tgz.enc" runs/${GITHUB_RUN_ID}/evidence.tgz.enc.part
          cp "$RUNNER_TEMP/k.enc" runs/${GITHUB_RUN_ID}/
          echo "source_sha=${GITHUB_SHA}" > runs/${GITHUB_RUN_ID}/SOURCE
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add runs
          git commit -q -m "evidence: manual acceptance run ${GITHUB_RUN_ID} for ${GITHUB_SHA::12}"
          git push -f origin HEAD:refs/heads/ci/onedeck-manual-evidence-${GITHUB_RUN_ID}
