name: Fork Local Worker bootstrap validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [experiment/manual-integration-actions]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Product source is admitted only after a measured qualifying baseline RED.
  # P builds once. C changes only this mode and measured public pin literals.
  BOOTSTRAP_CHECKPOINT_MODE: baseline-runtime-producer
  BOOTSTRAP_BASE_SHA: 8fcd0f33451058f55b110e707d50497545763615
  BOOTSTRAP_BASE_TREE: 85f6682f6a2db68e5a67e23719f2126e3d241133
  BOOTSTRAP_GUARD_SHA256: c81e0b02104ff4bbb4a9249faf26bedb70c23cb0bfc08b6138767c60a85d6dcc
  BOOTSTRAP_PRODUCER_SHA: ''
  BOOTSTRAP_PRODUCER_TREE: ''
  BOOTSTRAP_PRODUCER_WORKFLOW_SHA256: ''
  BOOTSTRAP_PRODUCER_GUARD_SHA256: ''
  BOOTSTRAP_PRODUCER_RUN_ID: ''
  BOOTSTRAP_PRODUCER_RUN_ATTEMPT: ''
  BOOTSTRAP_RUNTIME_ARTIFACT_ID: ''
  BOOTSTRAP_RUNTIME_ZIP_SHA256: ''
  BOOTSTRAP_RUNTIME_ZIP_SIZE: ''
  BOOTSTRAP_PROVENANCE_SHA256: ''
  BOOTSTRAP_RUNTIME_FILES: ''
  MANUAL_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  MANUAL_EVIDENCE: ${{ github.workspace }}/bootstrap-evidence
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  CARGO_TERM_COLOR: never

jobs:
  baseline-red:
    if: >-
      github.repository == 'Makeinu1/phase' &&
      github.event.pull_request.head.repo.full_name == 'Makeinu1/phase' &&
      github.event.pull_request.head.ref == 'experiment/manual-wasm-local-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-source
          persist-credentials: false
      - name: Checkout immutable baseline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.BOOTSTRAP_BASE_SHA }}
          path: baseline-source
          persist-credentials: false
      - name: Require explicit baseline checkpoint and clean independent sources
        working-directory: candidate-source
        run: |
          case "$BOOTSTRAP_CHECKPOINT_MODE" in
            baseline-runtime-producer|baseline-red) ;;
            *) printf '{"error":"runtime-pin-invalid"}\n'; exit 1 ;;
          esac
          mkdir -p "$MANUAL_EVIDENCE" "$RUNNER_TEMP/bootstrap-bindgen-baseline"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/bootstrap-wasm-target"
          printf 'CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          python3 scripts/ci/manual-integration-guard.py candidate-source-before true
          cd ../baseline-source
          MANUAL_EXPECTED_SOURCE_SHA="$BOOTSTRAP_BASE_SHA" \
            python3 ../candidate-source/scripts/ci/manual-integration-guard.py baseline-source-before true
          git rev-parse HEAD HEAD^{tree} > "$MANUAL_EVIDENCE/baseline-source.txt"
          git -C ../candidate-source rev-parse HEAD HEAD^{tree} > "$MANUAL_EVIDENCE/candidate-source.txt"
          sha256sum Cargo.lock client/pnpm-lock.yaml rust-toolchain.toml .cargo/config.toml \
            > "$MANUAL_EVIDENCE/baseline-inputs.sha256"
      - name: Verify fixed public source and recipe inputs
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py baseline-runtime-inputs python3 - 2>/dev/null <<'INPUTS'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          try:
              pins = {
                  'Cargo.lock': '5285fad7759794f57019d5d73e49cbc35207395b7faf31341da5bc80d32463f0',
                  'client/pnpm-lock.yaml': 'bc13ba1f6de5efd5bc724d9945aa541136df1d6938a41c53768f76c7b36c4ea4',
                  'rust-toolchain.toml': '52562c175563386d0f9f19afafd2855662ef2590765204b35bd624de13fe67af',
                  '.cargo/config.toml': 'da039ac38eb9d43e236e9eb89c65ef30a149d0539ed7ebfb3ee8f1d78b383c66',
              }
              for source in [Path('.'), Path('../baseline-source')]:
                  assert all(hashlib.sha256((source / name).read_bytes()).hexdigest() == value
                             for name, value in pins.items())
              tree = subprocess.check_output(['git', '-C', '../baseline-source', 'rev-parse', 'HEAD^{tree}'],
                                             stderr=subprocess.DEVNULL, text=True).strip()
              assert tree == os.environ['BOOTSTRAP_BASE_TREE']
              assert hashlib.sha256(Path('scripts/ci/manual-integration-guard.py').read_bytes()).hexdigest() == os.environ['BOOTSTRAP_GUARD_SHA256']
              assert os.environ['GITHUB_REPOSITORY'] == 'Makeinu1/phase'
              assert os.environ['GITHUB_REPOSITORY_ID'] == '1377698441'
              assert os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
              assert os.environ['CARGO_BUILD_JOBS'] == '1' and os.environ['CARGO_INCREMENTAL'] == '0'
              assert not any(value for name, value in os.environ.items() if
                             name.startswith('CARGO_PROFILE_') or name in [
                                 'CARGO_BUILD_TARGET', 'CARGO_BUILD_RUSTC', 'CARGO_BUILD_RUSTDOC',
                                 'RUSTC', 'RUSTDOC', 'ENGINE_WASM_URL'])
              if os.environ['BOOTSTRAP_CHECKPOINT_MODE'] == 'baseline-red':
                  for name, length in [
                      ('BOOTSTRAP_PRODUCER_SHA', 40), ('BOOTSTRAP_PRODUCER_TREE', 40),
                      ('BOOTSTRAP_PRODUCER_WORKFLOW_SHA256', 64), ('BOOTSTRAP_PRODUCER_GUARD_SHA256', 64),
                      ('BOOTSTRAP_RUNTIME_ZIP_SHA256', 64), ('BOOTSTRAP_PROVENANCE_SHA256', 64),
                  ]:
                      assert re.fullmatch('[a-f0-9]{' + str(length) + '}', os.environ[name])
                  assert os.environ['BOOTSTRAP_PRODUCER_GUARD_SHA256'] == os.environ['BOOTSTRAP_GUARD_SHA256']
                  for name in ['BOOTSTRAP_PRODUCER_RUN_ID', 'BOOTSTRAP_PRODUCER_RUN_ATTEMPT',
                               'BOOTSTRAP_RUNTIME_ARTIFACT_ID', 'BOOTSTRAP_RUNTIME_ZIP_SIZE']:
                      assert re.fullmatch('[1-9][0-9]*', os.environ[name])
                  files = json.loads(os.environ['BOOTSTRAP_RUNTIME_FILES'])
                  assert set(files) == {'engine_wasm.js', 'engine_wasm_bg.wasm', 'engine_wasm.d.ts', 'engine_wasm_bg.wasm.d.ts'}
                  assert all(set(value) == {'size', 'sha256'} and type(value['size']) is int and value['size'] > 0 and
                             re.fullmatch('[a-f0-9]{64}', value['sha256']) for value in files.values())
              print('{"runtime_inputs_verified":true}')
          except Exception:
              print('{"error":"runtime-pin-invalid"}')
              raise SystemExit(1)
          INPUTS
      - name: Install pinned producer Rust toolchain
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-runtime-producer'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly-2026-04-19
          target: wasm32-unknown-unknown
          rust-src-dir: baseline-source
          cache: false
          rustflags: ''
      - name: Install pinned producer bindgen
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-runtime-producer'
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: wasm-bindgen-cli@0.2.121
      - name: Verify actual pinned producer tools
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-runtime-producer'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py producer-tools python3 - 2>/dev/null <<'PRODUCER_TOOLS'
          import datetime, os, re, subprocess
          try:
              assert os.environ['CARGO_BUILD_JOBS'] == '1' and os.environ['CARGO_INCREMENTAL'] == '0'
              assert not any(value for name, value in os.environ.items() if name.startswith('CARGO_PROFILE_'))
              def read(argv):
                  return subprocess.check_output(argv, stderr=subprocess.DEVNULL, text=True).strip()
              active = read(['rustup', 'show', 'active-toolchain']).split()[0]
              assert active == 'nightly-2026-04-19-x86_64-unknown-linux-gnu'
              verbose = read(['rustc', '-Vv'])
              assert verbose == read(['rustup', 'run', 'nightly-2026-04-19', 'rustc', '-Vv'])
              fields = dict(line.split(': ', 1) for line in verbose.splitlines()[1:])
              assert set(fields) == {'binary', 'commit-hash', 'commit-date', 'host', 'release', 'LLVM version'}
              assert fields['binary'] == 'rustc' and fields['host'] == 'x86_64-unknown-linux-gnu'
              assert re.fullmatch('[0-9]+[.][0-9]+[.][0-9]+-nightly', fields['release'])
              assert re.fullmatch('[a-f0-9]{40}', fields['commit-hash'])
              assert datetime.date.fromisoformat(fields['commit-date']) <= datetime.date(2026, 4, 19)
              assert re.fullmatch('[0-9]+[.][0-9]+[.][0-9]+', fields['LLVM version'])
              cargo = read(['cargo', '-V'])
              assert cargo == read(['rustup', 'run', 'nightly-2026-04-19', 'cargo', '-V'])
              assert re.fullmatch(r'cargo [0-9]+[.][0-9]+[.][0-9]+-nightly \([a-f0-9]+ [0-9]{4}-[0-9]{2}-[0-9]{2}\)', cargo)
              assert read(['wasm-bindgen', '--version']) == 'wasm-bindgen 0.2.121'
              assert 'wasm32-unknown-unknown' in read(['rustup', 'target', 'list', '--installed']).splitlines()
              print('{"producer_tools_verified":true}')
          except Exception:
              print('{"error":"runtime-provenance-mismatch"}')
              raise SystemExit(1)
          PRODUCER_TOOLS
      - name: Install pinned consumer pnpm
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.9
      - name: Install pinned consumer Node
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Verify actual hosted tools without browser downloads
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py hosted-tools bash -euo pipefail <<'TOOLS'
          exec 2>/dev/null
          command -v google-chrome curl jq >/dev/null
          driver_binary=$(command -v chromedriver || true)
          if [ -z "$driver_binary" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then
            driver_binary="$CHROMEWEBDRIVER/chromedriver"
          fi
          test -n "$driver_binary"
          test -x "$driver_binary"
          printf 'BOOTSTRAP_CHROMEDRIVER=%s\n' "$driver_binary" >> "$GITHUB_ENV"
          test "$(node --version)" = v22.16.0
          test "$(pnpm --version)" = 9.15.9
          chrome_major=$(google-chrome --version | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          driver_major=$("$driver_binary" --version | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          test "$chrome_major" = "$driver_major"
          test -z "${ENGINE_WASM_URL:-}"
          printf '{"hosted_tools_verified":true}\n'
          TOOLS
      - name: Install one frozen candidate client dependency tree
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py client-dependencies \
            bash -euo pipefail -c 'pnpm --dir client install --frozen-lockfile >/dev/null 2>&1'
      - name: Check full candidate client types
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py client-types \
            bash -euo pipefail -c 'pnpm --dir client run type-check >/dev/null 2>&1'
      - name: Lint full candidate client
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py client-lint \
            bash -euo pipefail -c 'pnpm --dir client run lint >/dev/null 2>&1'
      - name: Check candidate protocol
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py client-protocol \
            bash -euo pipefail -c 'pnpm --dir client run protocol:check >/dev/null 2>&1'
      - name: Compile immutable baseline engine WASM once, default off
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-runtime-producer'
        working-directory: baseline-source
        run: |
          MANUAL_EXPECTED_SOURCE_SHA="$BOOTSTRAP_BASE_SHA" \
            python3 ../candidate-source/scripts/ci/manual-integration-guard.py baseline-wasm-build \
            bash -euo pipefail -c 'cargo build --locked -p engine-wasm --target wasm32-unknown-unknown \
            --profile wasm-dev --no-default-features >/dev/null 2>&1'
      - name: Bind the baseline artifact outside both source trees
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-runtime-producer'
        working-directory: baseline-source
        run: |
          MANUAL_EXPECTED_SOURCE_SHA="$BOOTSTRAP_BASE_SHA" \
            python3 ../candidate-source/scripts/ci/manual-integration-guard.py baseline-bindgen \
            bash -euo pipefail -c 'wasm-bindgen --target web --out-name engine_wasm \
            --out-dir "$RUNNER_TEMP/bootstrap-bindgen-baseline" \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/wasm-dev/engine_wasm.wasm" >/dev/null 2>&1'
      - name: Independently check producer source trees after build
        if: always() && env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-runtime-producer'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py candidate-source-after true
          cd ../baseline-source
          MANUAL_EXPECTED_SOURCE_SHA="$BOOTSTRAP_BASE_SHA" \
            python3 ../candidate-source/scripts/ci/manual-integration-guard.py baseline-source-after true
      - name: Package exact public baseline runtime
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-runtime-producer'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py baseline-runtime-package python3 - 2>/dev/null <<'PACKAGE'
          import datetime, hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          try:
              def read(argv):
                  return subprocess.check_output(argv, stderr=subprocess.DEVNULL, text=True).strip()
              def digest(path):
                  return hashlib.sha256(path.read_bytes()).hexdigest()
              inputs = {
                  'Cargo.lock': '5285fad7759794f57019d5d73e49cbc35207395b7faf31341da5bc80d32463f0',
                  'client/pnpm-lock.yaml': 'bc13ba1f6de5efd5bc724d9945aa541136df1d6938a41c53768f76c7b36c4ea4',
                  'rust-toolchain.toml': '52562c175563386d0f9f19afafd2855662ef2590765204b35bd624de13fe67af',
                  '.cargo/config.toml': 'da039ac38eb9d43e236e9eb89c65ef30a149d0539ed7ebfb3ee8f1d78b383c66',
              }
              base_sha, base_tree = os.environ['BOOTSTRAP_BASE_SHA'], os.environ['BOOTSTRAP_BASE_TREE']
              producer_sha, producer_tree = read(['git', 'rev-parse', 'HEAD']), read(['git', 'rev-parse', 'HEAD^{tree}'])
              assert producer_sha == os.environ['MANUAL_EXPECTED_SOURCE_SHA']
              assert read(['git', '-C', '../baseline-source', 'rev-parse', 'HEAD']) == base_sha
              assert read(['git', '-C', '../baseline-source', 'rev-parse', 'HEAD^{tree}']) == base_tree
              assert all(digest(source / name) == value for source in [Path('.'), Path('../baseline-source')]
                         for name, value in inputs.items())
              guard_hash = digest(Path('scripts/ci/manual-integration-guard.py'))
              assert guard_hash == os.environ['BOOTSTRAP_GUARD_SHA256']
              assert os.environ['CARGO_BUILD_JOBS'] == '1' and os.environ['CARGO_INCREMENTAL'] == '0'
              assert not any(value for name, value in os.environ.items() if name.startswith('CARGO_PROFILE_'))
              active = read(['rustup', 'show', 'active-toolchain']).split()[0]
              assert active == 'nightly-2026-04-19-x86_64-unknown-linux-gnu'
              verbose = read(['rustc', '-Vv'])
              assert verbose == read(['rustup', 'run', 'nightly-2026-04-19', 'rustc', '-Vv'])
              fields = dict(line.split(': ', 1) for line in verbose.splitlines()[1:])
              assert set(fields) == {'binary', 'commit-hash', 'commit-date', 'host', 'release', 'LLVM version'}
              assert fields['binary'] == 'rustc' and fields['host'] == 'x86_64-unknown-linux-gnu'
              assert re.fullmatch('[0-9]+[.][0-9]+[.][0-9]+-nightly', fields['release'])
              assert re.fullmatch('[a-f0-9]{40}', fields['commit-hash'])
              assert datetime.date.fromisoformat(fields['commit-date']) <= datetime.date(2026, 4, 19)
              assert re.fullmatch('[0-9]+[.][0-9]+[.][0-9]+', fields['LLVM version'])
              cargo = read(['cargo', '-V'])
              assert cargo == read(['rustup', 'run', 'nightly-2026-04-19', 'cargo', '-V'])
              assert re.fullmatch(r'cargo [0-9]+[.][0-9]+[.][0-9]+-nightly \([a-f0-9]+ [0-9]{4}-[0-9]{2}-[0-9]{2}\)', cargo)
              assert read(['wasm-bindgen', '--version']) == 'wasm-bindgen 0.2.121'
              toolchain = {'active': active, 'release': fields['release'], 'commit_hash': fields['commit-hash'],
                           'commit_date': fields['commit-date'], 'host': fields['host'], 'llvm': fields['LLVM version'],
                           'cargo': cargo, 'bindgen': 'wasm-bindgen 0.2.121'}
              compile_argv = ['cargo', 'build', '--locked', '-p', 'engine-wasm', '--target',
                              'wasm32-unknown-unknown', '--profile', 'wasm-dev', '--no-default-features']
              bindgen_argv = ['wasm-bindgen', '--target', 'web', '--out-name', 'engine_wasm', '--out-dir',
                              '"$RUNNER_TEMP/bootstrap-bindgen-baseline"',
                              '"$CARGO_TARGET_DIR/wasm32-unknown-unknown/wasm-dev/engine_wasm.wasm"']
              recipe = {'compile': compile_argv, 'bindgen': bindgen_argv, 'features': [], 'codegen_backend': 'llvm',
                        'opt_level': 2, 'stack_size': 16777216, 'jobs': 1, 'incremental': 0}
              labels = ['candidate-source-before', 'baseline-source-before', 'baseline-runtime-inputs',
                        'producer-tools', 'baseline-wasm-build', 'baseline-bindgen',
                        'candidate-source-after', 'baseline-source-after']
              receipts = {}
              receipt_keys = {'label', 'started_at', 'source_sha', 'event_sha', 'source_tree', 'argv',
                              'input_sha256', 'environment', 'guard', 'preflight', 'finished_at', 'exit_code',
                              'effective_exit', 'stop_reason', 'source_unchanged', '.log_sha256', '.jsonl_sha256'}
              for label in labels:
                  item = json.loads((Path(os.environ['MANUAL_EVIDENCE']) / (label + '.json')).read_text())
                  baseline = label.startswith('baseline-source-') or label in ['baseline-wasm-build', 'baseline-bindgen']
                  assert set(item) == receipt_keys and item['label'] == label
                  assert item['source_sha'] == (base_sha if baseline else producer_sha)
                  assert item['source_tree'] == (base_tree if baseline else producer_tree)
                  assert type(item['exit_code']) is int and item['exit_code'] == item['effective_exit'] == 0
                  assert item['stop_reason'] is None and item['source_unchanged'] is True
                  assert item['input_sha256'] == {key: inputs[key] for key in list(inputs)[:3]}
                  assert item['guard'] == {'working_set_bytes': 13 * 1024**3, 'disk_free_min_bytes': 4 * 1024**3,
                                           'sample_interval_seconds': 1, 'timeout_seconds': 1500}
                  environment = item['environment']
                  assert set(environment) == {'CARGO_TARGET_DIR', 'CARGO_BUILD_JOBS', 'RUST_MIN_STACK',
                                              'CARGO_INCREMENTAL', 'CARGO_PROFILE_DEV_DEBUG'}
                  assert environment['CARGO_TARGET_DIR'] == os.environ['CARGO_TARGET_DIR']
                  assert environment['CARGO_BUILD_JOBS'] == '1' and environment['CARGO_INCREMENTAL'] == '0'
                  assert environment['CARGO_PROFILE_DEV_DEBUG'] is None
                  assert environment['RUST_MIN_STACK'] in [None, '16777216']
                  reading = item['preflight']
                  assert reading['cap_bytes'] >= 13 * 1024**3 and reading['working_set_bytes'] <= 13 * 1024**3
                  assert min(reading['workspace_free_bytes'], reading['temp_free_bytes']) >= 4 * 1024**3
                  assert all(re.fullmatch('[a-f0-9]{64}', item[key]) for key in ['.log_sha256', '.jsonl_sha256'])
                  assert re.fullmatch('[a-f0-9]{40}', item['event_sha'])
                  assert datetime.datetime.fromisoformat(item['finished_at']) >= datetime.datetime.fromisoformat(item['started_at'])
                  if label in ['baseline-wasm-build', 'baseline-bindgen']:
                      assert item['argv'][:4] == ['bash', '-euo', 'pipefail', '-c'] and len(item['argv']) == 5
                      expected = compile_argv if label == 'baseline-wasm-build' else bindgen_argv
                      assert item['argv'][4].replace('\\\n', ' ').split() == expected + ['>/dev/null', '2>&1']
                  else:
                      assert item['argv'] == (['python3', '-'] if label in ['baseline-runtime-inputs', 'producer-tools'] else ['true'])
                  receipts[label] = item
              artifact = Path(os.environ['RUNNER_TEMP']) / 'bootstrap-bindgen-baseline'
              names = {'engine_wasm.js', 'engine_wasm_bg.wasm', 'engine_wasm.d.ts', 'engine_wasm_bg.wasm.d.ts'}
              assert {path.name for path in artifact.iterdir()} == names
              assert all((artifact / name).is_file() and not (artifact / name).is_symlink() and
                         (artifact / name).stat().st_size > 0 for name in names)
              files = {name: {'size': (artifact / name).stat().st_size, 'sha256': digest(artifact / name)}
                       for name in sorted(names)}
              workflow_path = '.github/workflows/wasm-local-bootstrap-validation.yml'
              assert os.environ['GITHUB_REPOSITORY'] == 'Makeinu1/phase' and os.environ['GITHUB_REPOSITORY_ID'] == '1377698441'
              assert os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
              assert all(re.fullmatch('[1-9][0-9]*', os.environ[key]) for key in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'])
              producer = {'repository': 'Makeinu1/phase', 'repository_id': 1377698441,
                          'sha': producer_sha, 'tree': producer_tree, 'workflow_path': workflow_path,
                          'workflow_sha256': digest(Path(workflow_path)), 'guard_sha256': guard_hash,
                          'run_id': int(os.environ['GITHUB_RUN_ID']), 'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                          'mode': 'baseline-runtime-producer'}
              descriptor = {'schema_version': 1, 'baseline': {'sha': base_sha, 'tree': base_tree},
                            'producer': producer, 'inputs': inputs, 'toolchain': toolchain,
                            'recipe': recipe, 'files': files, 'receipts': receipts}
              staging = Path(os.environ['RUNNER_TEMP']) / 'bootstrap-runtime-public'
              staging.mkdir(exist_ok=False)
              for name in sorted(names):
                  shutil.copyfile(artifact / name, staging / name)
                  assert digest(staging / name) == files[name]['sha256']
              descriptor_path = staging / 'baseline-runtime-provenance.json'
              descriptor_path.write_text(json.dumps(descriptor, sort_keys=True, indent=2) + '\n')
              lines = [files[name]['sha256'] + '  ' + name for name in sorted(names)]
              lines.append(digest(descriptor_path) + '  baseline-runtime-provenance.json')
              (Path(os.environ['MANUAL_EVIDENCE']) / 'baseline-artifacts.sha256').write_text('\n'.join(lines) + '\n')
