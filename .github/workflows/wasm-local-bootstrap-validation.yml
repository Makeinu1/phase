              # All metadata/member/descriptor/file/receipt checks precede extraction.
              artifact = Path(os.environ['RUNNER_TEMP']) / 'bootstrap-bindgen-baseline'
              assert artifact.is_dir() and not any(artifact.iterdir())
              for name, content in verified.items():
                  (artifact / name).write_bytes(content)
              (artifact / 'baseline-runtime-provenance.json').write_bytes(descriptor_bytes)
              public = {'producer_sha': producer_sha, 'producer_tree': producer_tree,
                        'producer_workflow_sha256': producer['workflow_sha256'], 'producer_guard_sha256': guard_hash,
                        'producer_run_id': run_id, 'producer_run_attempt': attempt, 'artifact_id': artifact_id,
                        'archive_sha256': archive_hash, 'archive_size': archive_size,
                        'provenance_sha256': provenance_hash, 'files': files}
              (root / 'red-adjudication.json').write_text(json.dumps({
                  'runtime_verified': True, 'public_runtime': public,
                  'producer_commands': {label: receipts[label] for label in ['baseline-wasm-build', 'baseline-bindgen']},
              }, sort_keys=True) + '\n')
              print('{"runtime_verified":true}')
          except Exception:
              (root / 'red-adjudication.json').write_text(json.dumps({'runtime_verified': False, 'runtime_error': code}) + '\n')
              print(json.dumps({'error': code}))
              raise SystemExit(1)
          FETCH
      - name: Copy only ignored runtime glue and WASM to the candidate alias
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py baseline-runtime-copy bash -euo pipefail <<'COPY'
          exec 2>/dev/null
          artifact="$RUNNER_TEMP/bootstrap-bindgen-baseline"
          test ! -d "$artifact/snippets"
          test -s "$artifact/engine_wasm.js"
          test -s "$artifact/engine_wasm_bg.wasm"
