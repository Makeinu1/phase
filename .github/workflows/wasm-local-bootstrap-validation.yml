                         'runtime-archive-mismatch', 'runtime-members-invalid', 'runtime-provenance-mismatch',
                         'runtime-file-mismatch', 'runtime-receipt-mismatch'] else None)}
          (root / 'red-adjudication.json').write_text(json.dumps(verdict, indent=2) + '\n')
          text = ('Qualifying baseline RED: true. All 90 controls and the real Worker action completed; '
                  'the expected experimental availability assertion failed. Product GREEN: NOT RUN.\n') if complete else (
