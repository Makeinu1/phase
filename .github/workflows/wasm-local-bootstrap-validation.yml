  stage1-green:
    if: github.repository == 'Makeinu1/phase' && github.event.pull_request.head.repo.full_name == 'Makeinu1/phase' && github.event.pull_request.head.ref == 'experiment/manual-wasm-local-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BOOTSTRAP_CHECKPOINT_MODE: stage1-green
      RUST_MIN_STACK: '16777216'
    steps:
    - name: Checkout immutable candidate source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate-source
        persist-credentials: false
    - name: Checkout immutable baseline source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.BOOTSTRAP_BASE_SHA }}
        path: baseline-source
        persist-credentials: false
    - name: Record clean immutable candidate and baseline sources
      working-directory: candidate-source
      run: |
        mkdir -p "$MANUAL_EVIDENCE" "$RUNNER_TEMP/bootstrap-bindgen-off" "$RUNNER_TEMP/bootstrap-bindgen-enabled" "$RUNNER_TEMP/bootstrap-native-archives"
        export CARGO_TARGET_DIR="$RUNNER_TEMP/bootstrap-wasm-target"
        printf 'CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
        python3 scripts/ci/manual-integration-guard.py candidate-source-before true
        cd ../baseline-source
        MANUAL_EXPECTED_SOURCE_SHA="$BOOTSTRAP_BASE_SHA" python3 ../candidate-source/scripts/ci/manual-integration-guard.py baseline-source-before true
        git rev-parse HEAD HEAD^{tree} > "$MANUAL_EVIDENCE/baseline-source.txt"
        git -C ../candidate-source rev-parse HEAD HEAD^{tree} > "$MANUAL_EVIDENCE/candidate-source.txt"
        sha256sum Cargo.lock client/pnpm-lock.yaml rust-toolchain.toml .cargo/config.toml > "$MANUAL_EVIDENCE/baseline-inputs.sha256"
    - name: Verify fixed public source and recipe inputs
      working-directory: candidate-source
      run: |
        python3 scripts/ci/manual-integration-guard.py baseline-runtime-inputs python3 - 2>/dev/null <<'INPUTS'
        import hashlib, json, os, re, subprocess
        from pathlib import Path
        try:
            def profile_environment_matches(environment, expected):
                return {name: value for name, value in environment.items()
                        if name.startswith('CARGO_PROFILE_')} == expected
            def fixed_flags_environment_matches(environment):
                return 'RUSTFLAGS' not in environment and 'CARGO_ENCODED_RUSTFLAGS' not in environment
            pins = {
                'Cargo.lock': '5285fad7759794f57019d5d73e49cbc35207395b7faf31341da5bc80d32463f0',
                'client/pnpm-lock.yaml': 'bc13ba1f6de5efd5bc724d9945aa541136df1d6938a41c53768f76c7b36c4ea4',
                'rust-toolchain.toml': '52562c175563386d0f9f19afafd2855662ef2590765204b35bd624de13fe67af',
