      - name: Copy only ignored runtime glue and WASM to the candidate alias
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py baseline-runtime-copy bash -euo pipefail <<'COPY'
          exec 2>/dev/null
          artifact="$RUNNER_TEMP/bootstrap-bindgen-baseline"
          test ! -d "$artifact/snippets"
          test -s "$artifact/engine_wasm.js"
          test -s "$artifact/engine_wasm_bg.wasm"
          git check-ignore client/src/wasm/engine_wasm.js client/src/wasm/engine_wasm_bg.wasm >/dev/null
          cp "$artifact/engine_wasm.js" client/src/wasm/engine_wasm.js
          cp "$artifact/engine_wasm_bg.wasm" client/src/wasm/engine_wasm_bg.wasm
          sha256sum "$artifact/engine_wasm.js" "$artifact/engine_wasm_bg.wasm" \
            "$artifact/engine_wasm.d.ts" "$artifact/engine_wasm_bg.wasm.d.ts" \
            "$artifact/baseline-runtime-provenance.json" \
            client/src/wasm/engine_wasm.js client/src/wasm/engine_wasm_bg.wasm \
            client/src/wasm/engine_wasm.d.ts > "$MANUAL_EVIDENCE/baseline-artifacts.sha256"
          cmp -s "$artifact/engine_wasm.js" client/src/wasm/engine_wasm.js
          cmp -s "$artifact/engine_wasm_bg.wasm" client/src/wasm/engine_wasm_bg.wasm
          COPY
      - name: Run existing affected adapter tests with one worker
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        working-directory: candidate-source
        run: |
          # Pinned Vitest 4.1.0's JSON reporter writes to stdout when outputFile
          # is absent. Raw report/failure text stays in memory; stderr is discarded.
          # https://github.com/vitest-dev/vitest/blob/v4.1.0/packages/vitest/src/node/reporters/json.ts
          python3 scripts/ci/manual-integration-guard.py client-adapter-tests python3 - 2>/dev/null <<'TESTS'
          import json, os, subprocess
          from pathlib import Path
          summary = {'runner_exit_code': None, 'report_valid': False, 'all_selected_tests_passed': False}
          result = None
          try:
              result = subprocess.run([
                  'pnpm', '--dir', 'client', 'exec', 'vitest', 'run', '--config', 'vitest.config.ts',
                  '--pool=forks', '--isolate', '--maxWorkers=1', '--no-file-parallelism',
                  '--coverage.enabled=false', '--reporter=json', '--silent=true',
                  'src/adapter/__tests__/engine-worker.test.ts',
                  'src/adapter/__tests__/engine-worker-client.test.ts',
                  'src/adapter/__tests__/wasm-adapter.test.ts',
              ], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, encoding='utf-8', errors='replace',
                  env={**os.environ, 'NO_COLOR': '1', 'FORCE_COLOR': '0'})
              summary['runner_exit_code'] = result.returncode
              report = json.loads(result.stdout)
              statuses = [case['status'] for file in report['testResults'] for case in file['assertionResults']]
              counts = {status: statuses.count(status) for status in ['passed', 'failed', 'skipped', 'pending', 'todo', 'disabled']}
              valid = (len(report['testResults']) == 3 and len(statuses) > 0 and
                       sum(counts.values()) == len(statuses) == report['numTotalTests'] and
                       counts['passed'] == report['numPassedTests'] and counts['failed'] == report['numFailedTests'])
              if valid:
                  summary.update(report_valid=True, tests_total=len(statuses),
                                 tests_executed=counts['passed'] + counts['failed'],
                                 tests_passed=counts['passed'], tests_failed=counts['failed'],
                                 tests_skipped=counts['skipped'], tests_pending=counts['pending'],
                                 tests_todo=counts['todo'], tests_disabled=counts['disabled'],
                                 all_selected_tests_passed=result.returncode == 0 and counts['passed'] == len(statuses))
          except Exception:
              summary['error'] = 'adapter-report-unavailable'
          Path(os.environ['MANUAL_EVIDENCE'], 'adapter-assertions.json').write_text(json.dumps(summary) + '\n')
          print(json.dumps(summary))
          code = result.returncode if result is not None else 1
          if code == 0 and not summary['all_selected_tests_passed']:
              code = 1
          raise SystemExit(code if code >= 0 else 128 - code)
          TESTS
      - name: Run actual baseline page and retain its terminal failure
        if: env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        id: baseline-browser
        working-directory: candidate-source
        run: |
          # Existing hosted browser/driver inventory and direct documented W3C API:
          # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#browsers-and-drivers
          # https://developer.chrome.com/docs/chromedriver/get-started
          # https://www.w3.org/TR/webdriver2/#execute-async-script
          python3 scripts/ci/manual-integration-guard.py baseline-browser bash -euo pipefail <<'BROWSER'
          # Raw W3C replies and session IDs stay in shell memory. Neither server
          # output nor browser/performance/driver logs are recorded, even on failure.
          exec 2>/dev/null
          session_id=''
          vite_pid=''
          driver_pid=''
          cleanup() {
            if [ -n "$session_id" ]; then
              curl --silent --max-time 10 -X DELETE "http://127.0.0.1:9515/session/$session_id" \
                >/dev/null || true
            fi
            if [ -n "$vite_pid" ]; then kill "$vite_pid" 2>/dev/null || true; fi
            if [ -n "$driver_pid" ]; then kill "$driver_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          trap 'printf "{\"error\":\"browser-command-failed\"}\n"' ERR
          TELEMETRY_URL='' pnpm --dir client dev --host 127.0.0.1 --port 5173 --strictPort \
            >/dev/null 2>&1 &
          vite_pid=$!
          CHROME_LOG_FILE=/dev/null "$BOOTSTRAP_CHROMEDRIVER" --port=9515 --log-path=/dev/null \
            >/dev/null 2>&1 &
          driver_pid=$!
          # One bounded startup interval and one preflight request; no polling or retry.
          sleep 5
          kill -0 "$vite_pid" "$driver_pid"
          driver_status=$(curl --fail --silent --max-time 10 http://127.0.0.1:9515/status)
          printf '%s' "$driver_status" | jq -e '.value.ready == true' >/dev/null
          served_glue_hash=$(curl --fail --silent --max-time 30 http://127.0.0.1:5173/src/wasm/engine_wasm.js \
            | sha256sum | cut -d ' ' -f 1)
          served_wasm_hash=$(curl --fail --silent --max-time 30 http://127.0.0.1:5173/src/wasm/engine_wasm_bg.wasm \
            | sha256sum | cut -d ' ' -f 1)
          wasm_hash=$(sha256sum client/src/wasm/engine_wasm_bg.wasm | cut -d ' ' -f 1)
          glue_hash=$(sha256sum client/src/wasm/engine_wasm.js | cut -d ' ' -f 1)
          test "$served_wasm_hash" = "$wasm_hash"
          printf '%s  served-engine-glue\n%s  served-engine-wasm\n' "$served_glue_hash" "$served_wasm_hash" \
            > "$MANUAL_EVIDENCE/served-artifacts.sha256"
          baseline_tree=$(git -C ../baseline-source rev-parse HEAD^{tree})
          candidate_tree=$(git rev-parse HEAD^{tree})
          url="http://127.0.0.1:5173/manual-resolution-wasm-worker.html?artifact=baseline&baseline_sha=$BOOTSTRAP_BASE_SHA&candidate_sha=$MANUAL_EXPECTED_SOURCE_SHA&baseline_tree=$baseline_tree&candidate_tree=$candidate_tree&wasm_sha256=$wasm_hash&glue_sha256=$glue_hash&served_glue_sha256=$served_glue_hash"
          session_response=$(jq -n --arg binary "$(command -v google-chrome)" \
            '{capabilities:{alwaysMatch:{browserName:"chrome","goog:chromeOptions":{binary:$binary,args:["--headless=new","--no-sandbox","--disable-dev-shm-usage","--disable-logging","--log-level=3"]},"goog:loggingPrefs":{browser:"OFF",performance:"OFF"}}}}' \
            | curl --fail --silent --max-time 60 -H 'Content-Type: application/json' \
              --data-binary @- http://127.0.0.1:9515/session)
          session_id=$(printf '%s' "$session_response" \
            | jq -er '.value.sessionId | select(type == "string" and test("^[a-zA-Z0-9-]+$"))')
          timeouts_response=$(jq -n '{script:130000,pageLoad:60000,implicit:0}' \
            | curl --fail --silent --max-time 10 -H 'Content-Type: application/json' \
              --data-binary @- "http://127.0.0.1:9515/session/$session_id/timeouts")
          printf '%s' "$timeouts_response" | jq -e '.value == null' >/dev/null
          navigation_response=$(jq -n --arg url "$url" '{url:$url}' \
            | curl --fail --silent --max-time 65 -H 'Content-Type: application/json' \
              --data-binary @- "http://127.0.0.1:9515/session/$session_id/url")
          printf '%s' "$navigation_response" | jq -e '.value == null' >/dev/null
          terminal_response=$(jq -n '{script:"const done = arguments[arguments.length - 1]; window.manualWasmBootstrap.completionPromise.then(done);",args:[]}' \
            | curl --fail --silent --max-time 140 -H 'Content-Type: application/json' \
              --data-binary @- "http://127.0.0.1:9515/session/$session_id/execute/async")
          # Select allowlisted fields before the first write. Unexpected values
          # become fixed invalid codes, never raw transport or application text.
          printf '%s' "$terminal_response" | jq -c '
            def fixed($values): . as $value | if ($values | index($value)) != null then $value else "invalid" end;
            def boolean: if type == "boolean" then . else null end;
            def hash($length): if type == "string" and test("^[a-f0-9]{" + ($length | tostring) + "}$") then . else null end;
            def error_code: if . == null then null else . as $code | if ([
              "boundary-object","artifact-fetch","worker-error-type","observation-failure",
              "ordinary-init-rejected","ordinary-init-envelope","ordinary-init-events","worker-result",
              "ordinary-install","viewer-rng-redaction","default-seed","default-player-count","default-format",
              "default-match-type","default-loop-detection","wasm-refusal-envelope","wasm-refusal-reasons",
              "wasm-refusal-reason-type","wasm-refusal-class","wasm-bracket-discriminator",
              "wasm-occupied-discriminator","wasm-refusal-classifier","worker-refusal","worker-refusal-class",
              "worker-bracket-discriminator","worker-occupied-discriminator","client-error-type","client-error-code",
              "refusal-resident-preservation","card-db-load","malformed-match-seed","malformed-match-type",
              "malformed-match-loop-detection","checkpoint-mode","limited-authority","served-wasm-identity",
              "served-glue-identity","baseline-source-identity","source-identity","glue-identity",
              "ordinary-decision","human-decision","issued-action","action-snapshot-change","action-recorded-once",
              "boundary-failure","experimental-exports-absent","page-deadline","page-error","page-rejection"
            ] | index($code)) != null then $code else "invalid-error" end end;
            def control_id: if type == "string" and test("^(wasm-shell|production-worker)\\.(local|host)\\.(resident_without_database|missing_database|omitted_defaults|null_defaults|undeclared_four_seats|malformed_match_fallback|valid_limited|all_cedh_bracket_reach|cedh_bracket_refusal|occupied_direction|resident_for_(local|host)_occupied|(valid_limited_for_)?(malformed_format|format_player_count|malformed_deck|player_deck_validation|opponent_deck_validation|empty_library_after_load))$") then . else "invalid-case" end;
            def diagnostic_case($row): if . == null then null
              elif $row == "ordinary_worker_action" and . == "production-worker.local.issued_action_reach" then .
              else control_id end;
            def stage: if . == null then null else fixed([
              "row","initialize","observe","viewer-redaction","trusted-defaults","default-fields",
              "refusal","resident-preservation","ordinary-action"
            ]) end;
            .value | {status:(.status | fixed(["pass","fail"])),
              reason:(.reason | fixed(["expected-experimental-availability","unexpected-baseline-exports","incomplete-controls","timeout","uncaught-error","unhandled-rejection"])),
              artifact:(.artifact | fixed(["baseline"])), error:(.error | error_code),
              caseId:(.rows[-1].name as $row | .caseId | diagnostic_case($row)), stage:(.stage | stage),
              rows:[(.rows // [])[] | {name:(.name | fixed(["artifact_identity","ordinary_initializer_preservation","ordinary_worker_action","experimental_availability"])),
                status:(.status | fixed(["pass","fail","pending"])), error:(.error | error_code),
                caseId:(.name as $row | .caseId | diagnostic_case($row)), stage:(.stage | stage),
                evidence:(if .name == "artifact_identity" then .evidence | {
                  wasmHash:(.wasmHash | hash(64)), servedGlueHash:(.servedGlueHash | hash(64)),
                  supplied:{candidate_sha:(.supplied.candidate_sha | hash(40)), baseline_sha:(.supplied.baseline_sha | hash(40)),
                    candidate_tree:(.supplied.candidate_tree | hash(40)), baseline_tree:(.supplied.baseline_tree | hash(40)),
                    glue_sha256:(.supplied.glue_sha256 | hash(64))}}
                elif .name == "ordinary_initializer_preservation" then [(.evidence // [])[] | {
                  name:(.name | control_id), status:(.status | fixed(["pass"])), evidence:{
                    reachGuard:(if .evidence.reachGuard == null then null else .evidence.reachGuard | control_id end),
                    initializationAccepted:(.evidence.initializationAccepted | boolean), stateInstalled:(.evidence.stateInstalled | boolean),
                    replayInstalled:(.evidence.replayInstalled | boolean), defaultsMatched:(.evidence.defaultsMatched | boolean),
                    viewerRngRedacted:(.evidence.viewerRngRedacted | boolean), trustedSeedPreserved:(.evidence.trustedSeedPreserved | boolean),
                    refusalClassMatched:(.evidence.refusalClassMatched | boolean), typedDiscriminatorsMatched:(.evidence.typedDiscriminatorsMatched | boolean),
                    clientCodeMatched:(.evidence.clientCodeMatched | boolean), residentPreserved:(.evidence.residentPreserved | boolean)}}]
                elif .name == "ordinary_worker_action" then .evidence | {
                  ordinaryDecisionReached:(.ordinaryDecisionReached | boolean), humanDecisionIssued:(.humanDecisionIssued | boolean),
                  engineIssuedAction:(.engineIssuedAction | boolean), snapshotChanged:(.snapshotChanged | boolean),
                  replayRecordedOnce:(.replayRecordedOnce | boolean), recordedActionCount:(if .recordedActionCount == 1 then 1 else null end)}
                elif .name == "experimental_availability" then .evidence | {
                  initialize_experimental_local_game:(.initialize_experimental_local_game | boolean), experimental_local_actor:(.experimental_local_actor | boolean)}
                else null end)}]}' > "$MANUAL_EVIDENCE/baseline-terminal.json"
          jq -c '{status,reason,error,caseId,stage,rows:[.rows[] | {name,status,error,caseId,stage,controls:
            (if (.evidence | type) == "array" then (.evidence | length) else null end)}]}' \
            "$MANUAL_EVIDENCE/baseline-terminal.json"
          jq -e '.status == "fail" and .reason == "expected-experimental-availability" and
            (.rows | length == 4) and
            ([.rows[] | select(.status == "fail") | .name] == ["experimental_availability"]) and
            ([.rows[] | select(.status == "pending")] | length == 0)' "$MANUAL_EVIDENCE/baseline-terminal.json" >/dev/null
          # Preserve the experimental assertion's actual nonzero outcome.
          exit 1
          BROWSER
      - name: Independently check both source trees after execution
        if: always() && env.BOOTSTRAP_CHECKPOINT_MODE == 'baseline-red'
        working-directory: candidate-source
        run: |
          python3 scripts/ci/manual-integration-guard.py candidate-source-after true
          cd ../baseline-source
          MANUAL_EXPECTED_SOURCE_SHA="$BOOTSTRAP_BASE_SHA" \
            python3 ../candidate-source/scripts/ci/manual-integration-guard.py baseline-source-after true
      - name: Adjudicate complete RED from retained evidence
        if: always()
        run: |
          python3 - 2>/dev/null <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def profile_environment_matches(environment, expected):
              return {name: value for name, value in environment.items()
                      if name.startswith('CARGO_PROFILE_')} == expected
          def receipt_profile_matches(label, environment, expected):
              return (label in expected and 'CARGO_PROFILE_DEV_DEBUG' in environment and
                      environment['CARGO_PROFILE_DEV_DEBUG'] == expected[label])
          producer_receipt_profiles = {
              'candidate-source-before': None, 'baseline-source-before': None, 'baseline-runtime-inputs': None,
              'producer-tools': '0', 'baseline-wasm-build': '0', 'baseline-bindgen': '0',
              'candidate-source-after': '0', 'baseline-source-after': '0',
          }
          current_producer_receipt_profiles = {
              **producer_receipt_profiles, 'baseline-runtime-package': '0', 'baseline-runtime-pins': '0',
          }
          consumer_receipt_profiles = {
              'candidate-source-before': None, 'baseline-source-before': None, 'baseline-runtime-inputs': None,
              'hosted-tools': None, 'baseline-runtime-fetch': None, 'baseline-runtime-copy': None,
              'client-dependencies': None, 'client-types': None, 'client-lint': None, 'client-protocol': None,
              'client-adapter-tests': None, 'baseline-browser': None,
              'candidate-source-after': None, 'baseline-source-after': None,
          }
          root = Path(os.environ['MANUAL_EVIDENCE'])
          root.mkdir(parents=True, exist_ok=True)
          def load(name):
              try:
                  value = json.loads((root / name).read_text())
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}
          mode = os.environ['BOOTSTRAP_CHECKPOINT_MODE']
          runtime = load('red-adjudication.json')
          producer_mode = mode == 'baseline-runtime-producer'
          labels = (['candidate-source-before', 'baseline-source-before', 'baseline-runtime-inputs',
                     'producer-tools', 'baseline-wasm-build', 'baseline-bindgen', 'candidate-source-after',
                     'baseline-source-after', 'baseline-runtime-package', 'baseline-runtime-pins'] if producer_mode else
                    ['candidate-source-before', 'baseline-source-before', 'baseline-runtime-inputs', 'hosted-tools',
                     'baseline-runtime-fetch', 'baseline-runtime-copy', 'client-dependencies', 'client-types',
                     'client-lint', 'client-protocol', 'client-adapter-tests', 'baseline-browser',
                     'candidate-source-after', 'baseline-source-after'])
          complete = mode in ['baseline-runtime-producer', 'baseline-red']
          complete &= profile_environment_matches(os.environ, {'CARGO_PROFILE_DEV_DEBUG': '0'} if producer_mode else {})
          expected_profiles = current_producer_receipt_profiles if producer_mode else consumer_receipt_profiles
          records = {}
          for label in labels:
              item = load(label + '.json')
              records[label] = item
              baseline = label.startswith('baseline-source-') or label in ['baseline-wasm-build', 'baseline-bindgen']
              expected_sha = os.environ['BOOTSTRAP_BASE_SHA'] if baseline else os.environ['MANUAL_EXPECTED_SOURCE_SHA']
              expected_exit = 1 if label == 'baseline-browser' else 0
              complete &= bool(item and item.get('source_sha') == expected_sha and
                               item.get('label') == label and isinstance(item.get('environment'), dict) and
                               receipt_profile_matches(label, item['environment'], expected_profiles) and
                               item.get('guard') == {'working_set_bytes': 13 * 1024**3, 'disk_free_min_bytes': 4 * 1024**3,
                                                     'sample_interval_seconds': 1, 'timeout_seconds': 2400 if label == 'baseline-wasm-build' else 1500} and
                               type(item.get('exit_code')) is int and item.get('exit_code') == expected_exit and
                               type(item.get('effective_exit')) is int and item.get('effective_exit') == expected_exit and
                               item.get('stop_reason') is None and item.get('source_unchanged') is True)
          public = runtime.get('public_runtime', {})
          if producer_mode:
              complete &= bool(public and public.get('producer_sha') == os.environ['MANUAL_EXPECTED_SOURCE_SHA'] and
                               public.get('producer_tree') == records['candidate-source-before'].get('source_tree') and
                               public.get('producer_guard_sha256') == os.environ['BOOTSTRAP_GUARD_SHA256'] and
                               public.get('producer_run_id') == int(os.environ['GITHUB_RUN_ID']) and
                               public.get('producer_run_attempt') == int(os.environ['GITHUB_RUN_ATTEMPT']))
              verdict = {'checkpoint_mode': mode, 'producer_complete': bool(complete),
                         'qualifying_baseline_red': False, 'baseline_browser_executed': False,
                         'product_green': 'NOT RUN: tests-only checkpoint', 'public_runtime': public, 'commands': records}
              (root / 'red-adjudication.json').write_text(json.dumps(verdict, indent=2) + '\n')
              text = ('Baseline runtime producer complete: true. Public bundle pins measured. '
                      'Qualifying baseline RED: false. Browser: NOT RUN. Product GREEN: NOT RUN.\n') if complete else (
                      'Baseline runtime producer complete: false. Execution evidence is incomplete. '
                      'Qualifying baseline RED: false. Browser: NOT RUN. Product GREEN: NOT RUN.\n')
              print(text)
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write(text)
              raise SystemExit(0 if complete else 1)
          complete &= runtime.get('runtime_verified') is True
          producer_commands = runtime.get('producer_commands', {})
          try:
              expected_public = {
                  'producer_sha': os.environ['BOOTSTRAP_PRODUCER_SHA'], 'producer_tree': os.environ['BOOTSTRAP_PRODUCER_TREE'],
                  'producer_workflow_sha256': os.environ['BOOTSTRAP_PRODUCER_WORKFLOW_SHA256'],
                  'producer_guard_sha256': os.environ['BOOTSTRAP_PRODUCER_GUARD_SHA256'],
                  'producer_run_id': int(os.environ['BOOTSTRAP_PRODUCER_RUN_ID']),
                  'producer_run_attempt': int(os.environ['BOOTSTRAP_PRODUCER_RUN_ATTEMPT']),
                  'artifact_id': int(os.environ['BOOTSTRAP_RUNTIME_ARTIFACT_ID']),
                  'archive_sha256': os.environ['BOOTSTRAP_RUNTIME_ZIP_SHA256'],
                  'archive_size': int(os.environ['BOOTSTRAP_RUNTIME_ZIP_SIZE']),
                  'provenance_sha256': os.environ['BOOTSTRAP_PROVENANCE_SHA256'],
                  'files': json.loads(os.environ['BOOTSTRAP_RUNTIME_FILES']),
              }
              complete &= public == expected_public
              artifact = Path(os.environ['RUNNER_TEMP']) / 'bootstrap-bindgen-baseline'
              descriptor_bytes = (artifact / 'baseline-runtime-provenance.json').read_bytes()
              complete &= hashlib.sha256(descriptor_bytes).hexdigest() == expected_public['provenance_sha256']
              descriptor = json.loads(descriptor_bytes)
              complete &= producer_commands == {label: descriptor['receipts'][label]
                  for label in ['baseline-wasm-build', 'baseline-bindgen']}
              for label in ['baseline-wasm-build', 'baseline-bindgen']:
                  receipt = producer_commands[label]
                  complete &= receipt['source_sha'] == os.environ['BOOTSTRAP_BASE_SHA']
                  complete &= receipt['source_tree'] == os.environ['BOOTSTRAP_BASE_TREE']
                  complete &= receipt['exit_code'] == receipt['effective_exit'] == 0
                  complete &= receipt['stop_reason'] is None and receipt['source_unchanged'] is True
                  complete &= receipt['label'] == label and receipt_profile_matches(
                      label, receipt['environment'], producer_receipt_profiles)
                  complete &= receipt['guard'] == {'working_set_bytes': 13 * 1024**3, 'disk_free_min_bytes': 4 * 1024**3,
                                                  'sample_interval_seconds': 1, 'timeout_seconds': 2400 if label == 'baseline-wasm-build' else 1500}
              for name, item in expected_public['files'].items():
                  content = (artifact / name).read_bytes()
                  complete &= len(content) == item['size'] and hashlib.sha256(content).hexdigest() == item['sha256']
          except Exception:
              complete = False
          terminal_path = root / 'baseline-terminal.json'
          terminal = json.loads(terminal_path.read_text()) if terminal_path.is_file() else {}
          if not isinstance(terminal, dict):
              terminal = {}
          adapter_path = root / 'adapter-assertions.json'
