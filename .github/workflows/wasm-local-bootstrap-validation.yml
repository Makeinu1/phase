    - name: Archive and run the two native lib configurations sequentially
      working-directory: candidate-source
      run: |
        export CARGO_TARGET_DIR="$RUNNER_TEMP/bootstrap-native-target"
        for artifact in off enabled; do
          count=10
          if [ "$artifact" = enabled ]; then count=16; fi
          export BOOTSTRAP_NATIVE_ARTIFACT="$artifact" BOOTSTRAP_NATIVE_TEST_COUNT="$count"
          python3 scripts/ci/manual-integration-guard.py "candidate-native-$artifact-archive" bash -euo pipefail -c '
            features=(); if [ "$BOOTSTRAP_NATIVE_ARTIFACT" = enabled ]; then features=(--features manual_resolution_local_bootstrap); fi
            cargo nextest archive --locked --profile ci --config profile.test.debug=0 --config profile.test.incremental=false --config "profile.test.codegen-backend=\"cranelift\"" -p engine-wasm --lib --no-default-features "${features[@]}" --archive-file "$RUNNER_TEMP/bootstrap-native-archives/$BOOTSTRAP_NATIVE_ARTIFACT.tar.zst" >/dev/null 2>&1'
          python3 scripts/ci/manual-integration-guard.py "candidate-native-$artifact-tests" python3 - 2>/dev/null <<'NATIVE'
        import json, os, re, subprocess
        from pathlib import Path
        artifact = os.environ['BOOTSTRAP_NATIVE_ARTIFACT']; count = int(os.environ['BOOTSTRAP_NATIVE_TEST_COUNT'])
        result = subprocess.run(['cargo-nextest', 'nextest', 'run', '--profile', 'ci',
            '--archive-file', str(Path(os.environ['RUNNER_TEMP']) / f'bootstrap-native-archives/{artifact}.tar.zst'),
            '--workspace-remap', str(Path.cwd()), '--extract-to', str(Path(os.environ['RUNNER_TEMP']) / f'bootstrap-native-{artifact}'),
            '-E', 'test(ordinary_initializer_preservation_tests) | test(experimental_local_bootstrap_tests) | test(engine_claim_guard_tests)',
            '--status-level', 'all', '--final-status-level', 'all'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
        text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', result.stdout)
        ordinary = ['ordinary_initializer_preservation_tests::defaults_are_installed_with_trusted_seed_and_redacted_viewer', 'ordinary_initializer_preservation_tests::configured_deck_install_and_all_preparation_refusals_preserve_local_resident', 'ordinary_initializer_preservation_tests::host_preparation_refusals_never_install_or_claim', 'ordinary_initializer_preservation_tests::occupied_refusals_are_typed_and_preserve_both_directions', 'ordinary_initializer_preservation_tests::successful_ordinary_install_invalidates_previous_authority_and_cache', 'engine_claim_guard_tests::a_multiplayer_host_is_refused_when_the_engine_already_holds_a_game', 'engine_claim_guard_tests::a_multiplayer_host_may_claim_an_empty_engine', 'engine_claim_guard_tests::a_local_game_is_refused_while_a_multiplayer_host_owns_the_engine', 'engine_claim_guard_tests::a_local_game_may_still_replace_another_local_game', 'engine_claim_guard_tests::only_a_multiplayer_host_claims_the_engine']
        experimental = ['experimental_local_bootstrap_tests::admission_is_explicit_and_verification_never_mints', 'experimental_local_bootstrap_tests::failed_bootstrap_preserves_ordinary_and_experimental_residents', 'experimental_local_bootstrap_tests::verifier_checks_actual_resident_seat_session_and_posture', 'experimental_local_bootstrap_tests::checked_restore_failure_preserves_and_success_revokes', 'experimental_local_bootstrap_tests::ordinary_supersession_clear_and_host_cannot_admit', 'experimental_local_bootstrap_tests::private_binding_is_absent_from_save_viewer_and_replay']
        expected = set(ordinary + (experimental if artifact == 'enabled' else []))
        pass_names = re.findall(r'^\s*PASS\s+\[[^\]]+\]\s+(?:\([0-9]+/[0-9]+\)\s+)?\S+\s+(\S+)\s*$', text, re.M)
        seen = set(re.findall(r'^\s*(?:PASS|FAIL|ABORT|TIMEOUT)\s+\[[^\]]+\]\s+(?:\([0-9]+/[0-9]+\)\s+)?\S+\s+(\S+)\s*$', text, re.M)) & expected
        passed = (result.returncode == 0 and len(pass_names) == count and set(pass_names) == expected
            and re.search(rf'Summary[^\n]*\b{count} tests run: {count} passed\b', text) is not None)
        path = Path(os.environ['MANUAL_EVIDENCE']) / 'red-adjudication.json'
        value = json.loads(path.read_text()) if path.exists() else {}
        value.setdefault('native_tests', {})[artifact] = {'selected': count, 'executed': len(seen), 'passed': bool(passed)}
        filtered = re.search(r'Summary[^\n]*\b([0-9]+) skipped\b', text)
        value.setdefault('native_filter_counts', {})[artifact] = int(filtered.group(1)) if filtered else None
        path.write_text(json.dumps(value) + '\n'); print(json.dumps({'native_selected_tests_passed': bool(passed), 'selected': count}))
        raise SystemExit(0 if passed else 1)
        NATIVE
